# Podman Desktop: run with `podman kube play --replace deploy/podman/pod.yaml`
# after `podman build -t localhost/fde-01-foundations:local .` (or `make up-podman`).
# The same manifest style is used later on Kubernetes, which makes this a gentle
# first step from containers to pods. No secrets are needed: models are baked into the image.
apiVersion: v1
kind: Pod
metadata:
  name: fde-01-foundations
  labels:
    app.kubernetes.io/name: fde-01-foundations
spec:
  restartPolicy: Always
  containers:
    - name: api
      image: localhost/fde-01-foundations:local
      ports:
        - containerPort: 8000
          hostPort: 8000
          hostIP: 127.0.0.1
      env:
        - name: ENVIRONMENT
          value: local
        - name: SERVE_MODEL
          value: banking77/baseline
        - name: ROUTE_THRESHOLD
          value: "0.5"
      resources:
        limits:
          cpu: "1"
          memory: 1Gi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: tmp
          mountPath: /tmp
      livenessProbe:
        httpGet: {path: /health/live, port: 8000}
        initialDelaySeconds: 5
        periodSeconds: 10
      readinessProbe:
        httpGet: {path: /health/ready, port: 8000}
        initialDelaySeconds: 3
        periodSeconds: 5
  volumes:
    - name: tmp
      emptyDir: {}

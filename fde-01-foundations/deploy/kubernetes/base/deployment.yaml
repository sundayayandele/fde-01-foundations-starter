# Trained models are baked into the image (/app/models). The optional Secret is kept for
# later phases that call LLM APIs; this service needs no secrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fde-01-foundations
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: fde-01-foundations
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels:
        app: fde-01-foundations
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics/
    spec:
      serviceAccountName: fde-01-foundations
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true          # no fixed runAsUser, so OpenShift can assign one
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: fde-01-foundations:local
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: fde-01-foundations-config}
            - secretRef: {name: fde-01-foundations-secrets, optional: true}
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}

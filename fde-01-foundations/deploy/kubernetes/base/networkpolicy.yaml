# Ingress only on the HTTP port. The classifier makes no outbound calls, so egress is
# denied except DNS, which limits what a compromised pod could send out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fde-01-foundations
spec:
  podSelector:
    matchLabels:
      app: fde-01-foundations
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {protocol: TCP, port: 8000}
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}

groups:
  - name: fde-01-foundations
    rules:
      - alert: ServiceDown
        expr: up{job="fde-01-foundations"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "fde-01-foundations is not being scraped"
          runbook: "docs/DEPLOYMENT.md#troubleshooting"

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "More than 5% of requests return 5xx"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "p95 latency above 1 second"

      # Model behaviour. On Banking77 test data the baseline sends about 13% of messages to
      # a person (evals/results). A sustained rise means the incoming messages no longer look
      # like the training data (drift) or a worse model was deployed.
      - alert: HumanReviewShareHigh
        expr: |
          sum(rate(predictions_total{route="human"}[1h]))
            / clamp_min(sum(rate(predictions_total[1h])), 1e-9) > 0.30
        for: 2h
        labels: {severity: warning}
        annotations:
          summary: "More than 30% of predictions routed to human review for 2 hours (possible drift)"
          runbook: "docs/DEPLOYMENT.md#troubleshooting"

      - alert: ModelInferenceSlow
        expr: |
          histogram_quantile(0.95, sum by (le, model) (rate(model_inference_seconds_bucket[10m]))) > 0.25
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "p95 model inference above 250 ms"

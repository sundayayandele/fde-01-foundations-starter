# Used by the `observability` Compose profile. On Kubernetes, scrape via the
# prometheus.io/* pod annotations or a ServiceMonitor instead.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: fde-01-foundations
    metrics_path: /metrics/
    static_configs:
      - targets: ["api:8000"]

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Complaint router</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #e3e1d9;
    --accent: #1f5f8b; --auto: #1e7a46; --auto-bg: #e4f3ea; --human: #9a5a00; --human-bg: #fbefdc;
    --bar: #d7e5ef; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1f1f1d; --ink: #ecebe6; --muted: #a3a29b; --line: #34332f;
      --accent: #7fb6dc; --auto: #7fd3a1; --auto-bg: #183325; --human: #f0b45e; --human-bg: #3a2a12;
      --bar: #2a3b48;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
           flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
           padding: 18px; margin-bottom: 16px; }
  label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
  select, textarea { width: 100%; font: inherit; color: var(--ink); background: var(--bg);
                     border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  textarea { min-height: 130px; resize: vertical; }
  select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent);
                                                       outline-offset: 1px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  button { font: inherit; border-radius: 8px; padding: 9px 16px; cursor: pointer;
           border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff;
                   font-weight: 600; }
  @media (prefers-color-scheme: dark) { button.primary { color: #10202c; } }
  button.chip { font-size: 13px; padding: 5px 10px; border-radius: 999px; color: var(--muted); }
  .result h2 { font-size: 20px; margin: 0; font-family: var(--mono); word-break: break-word; }
  .badge { display: inline-block; font-size: 13px; font-weight: 600; padding: 3px 10px;
           border-radius: 999px; }
  .badge.auto { color: var(--auto); background: var(--auto-bg); }
  .badge.human { color: var(--human); background: var(--human-bg); }
  .meta { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .bars { margin-top: 14px; display: grid; gap: 8px; }
  .bar { display: grid; grid-template-columns: minmax(0, 1fr) 56px; gap: 10px; align-items: center;
         font-size: 14px; }
  .track { position: relative; background: var(--bar); border-radius: 6px; height: 28px;
           overflow: hidden; }
  .fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); opacity: .28; }
  .track span { position: relative; padding: 0 10px; line-height: 28px; font-family: var(--mono);
                font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                display: block; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .error { color: var(--human); }
  footer { color: var(--muted); font-size: 13px; }
  code { font-family: var(--mono); font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Complaint router</h1>
      <p class="sub">Predicts where a complaint should go, and sends it to a person when the model is unsure.</p>
    </div>
    <span class="sub" id="version"></span>
  </header>

  <section class="panel">
    <label for="model">Model</label>
    <select id="model"><option>Loading models…</option></select>
    <div style="height:12px"></div>
    <label for="text">Complaint or customer message</label>
    <textarea id="text" maxlength="5000" placeholder="e.g. My card still hasn't arrived after two weeks"></textarea>
    <div class="row">
      <button class="primary" id="go">Route it</button>
      <button class="chip" data-example="My new card still hasn't arrived and it's been two weeks.">Card not arrived</button>
      <button class="chip" data-example="I was charged twice for the same purchase yesterday.">Charged twice</button>
      <button class="chip" data-example="Why is the exchange rate on my transfer so bad?">Exchange rate</button>
      <button class="chip" data-example="Hello, can you help me?">Vague message</button>
    </div>
  </section>

  <section class="panel result" id="result" hidden aria-live="polite"></section>

  <footer>
    Text you enter is sent to this service only and is not logged. API docs: <a href="docs">/docs</a> · metrics: <code>/metrics/</code>
  </footer>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  async function loadModels() {
    try {
      const [models, health] = await Promise.all([
        fetch("api/v1/models").then((r) => r.json()),
        fetch("health/ready").then((r) => r.json()),
      ]);
      $("version").textContent = "v" + health.version;
      if (!models.length) {
        $("model").innerHTML = "<option value=''>No trained model available</option>";
        return;
      }
      $("model").innerHTML = models.map((m) =>
        `<option value="${esc(m.name)}" ${m.default ? "selected" : ""}>${esc(m.name)} · ${esc(m.labels)} labels` +
        (m.metrics.test_macro_f1 != null ? ` · macro-F1 ${m.metrics.test_macro_f1}` : "") + "</option>").join("");
    } catch (e) {
      $("model").innerHTML = "<option value=''>Could not load models</option>";
    }
  }

  async function routeIt() {
    const text = $("text").value.trim();
    const box = $("result");
    if (!text) { $("text").focus(); return; }
    $("go").disabled = true;
    try {
      const r = await fetch("api/v1/predict", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({text, model: $("model").value || null}),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : "Request failed (" + r.status + ")");
      const why = {confident: "confident", low_confidence: "low confidence", ambiguous: "top two are close"}[d.reason] || d.reason;
      box.innerHTML = `
        <div class="row" style="margin-top:0;justify-content:space-between">
          <h2>${esc(d.label)}</h2>
          <span class="badge ${d.route}">${d.route === "auto" ? "Auto-route" : "Send to a person"} · ${esc(why)}</span>
        </div>
        <div class="meta">${esc(d.target)} · confidence ${(d.confidence * 100).toFixed(1)}% · ${esc(d.model)} · ${d.latency_ms} ms</div>
        <div class="bars">${d.top.map((t) => `
          <div class="bar"><div class="track"><div class="fill" style="width:${(t.probability * 100).toFixed(1)}%"></div>
          <span title="${esc(t.label)}">${esc(t.label)}</span></div><div class="num">${(t.probability * 100).toFixed(1)}%</div></div>`).join("")}
        </div>`;
    } catch (e) {
      box.innerHTML = `<p class="error">${esc(e.message)}</p>`;
    } finally {
      box.hidden = false;
      $("go").disabled = false;
    }
  }

  $("go").addEventListener("click", routeIt);
  $("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) routeIt(); });
  document.querySelectorAll("[data-example]").forEach((b) =>
    b.addEventListener("click", () => { $("text").value = b.dataset.example; routeIt(); }));
  loadModels();
</script>
</body>
</html>

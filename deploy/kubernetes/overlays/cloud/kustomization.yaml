# Managed Kubernetes (EKS, AKS, GKE). Set the image to your registry with
#   cd deploy/kubernetes/overlays/cloud && kustomize edit set image fde-01-foundations=<registry>/fde-01-foundations:<tag>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ingress.yaml
images:
  - name: fde-01-foundations
    newName: REGISTRY/fde-01-foundations
    newTag: "1.0.0"
patches:
  - target: {kind: Deployment, name: fde-01-foundations}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

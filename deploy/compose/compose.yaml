# One Compose file for Docker Desktop, Rancher Desktop (dockerd/moby engine)
# and Podman Desktop (`podman compose`). Paths are relative to this file.
#
#   make up-docker | make up-rancher | make up-podman-compose
#   docker compose -f deploy/compose/compose.yaml --profile observability up -d
#
# The image carries its trained models (Banking77 baseline and MLP by default). To serve
# your own bundles instead, mount them:  volumes: ["../../models:/app/models:ro"]
name: fde-01-foundations

services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: fde-01-foundations:local
    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:8000"   # local only; never bind 0.0.0.0 in labs
    environment:
      SERVICE_NAME: fde-01-foundations
      ENVIRONMENT: ${ENVIRONMENT:-local}
      SERVE_MODEL: ${SERVE_MODEL:-banking77/baseline}
      ROUTE_THRESHOLD: ${ROUTE_THRESHOLD:-0.5}
      ROUTE_MARGIN: ${ROUTE_MARGIN:-0.1}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  prometheus:
    profiles: [observability]
    image: docker.io/prom/prometheus:v2.55.1
    volumes:
      - ../../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [api]

  grafana:
    profiles: [observability]
    image: docker.io/grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
